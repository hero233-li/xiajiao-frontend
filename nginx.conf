# Docker 官方 Nginx 入口将本模板生成至 /etc/nginx/conf.d/default.conf。
# BACKEND_ORIGIN 示例：http://backend:8080（不要附加 /api/v1）。
server {
    listen 80;
    listen [::]:80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;
    client_max_body_size 11m;

    add_header X-Content-Type-Options nosniff always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 使用 Docker DNS 按请求解析，后端尚未启动时前端仍可提供静态页面。
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;
    set $backend_origin "${BACKEND_ORIGIN}";

    # Fixed, read-only source for the official exam countdown. No user credentials go upstream.
    location = /exam-countdown-source {
        set $exam_source https://ce.sjtu.edu.cn/;
        proxy_pass $exam_source;
        proxy_ssl_server_name on;
        proxy_ssl_name ce.sjtu.edu.cn;
        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_set_header Host ce.sjtu.edu.cn;
        proxy_set_header Cookie "";
        proxy_set_header Authorization "";
        proxy_set_header Accept-Encoding "";
        proxy_hide_header Set-Cookie;
        proxy_hide_header Content-Type;
        proxy_hide_header Cache-Control;
        proxy_hide_header Expires;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
        limit_except GET { deny all; }
        add_header Content-Type "text/plain; charset=utf-8" always;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # API 不参与 SPA 回退，也不缓存；原样保留路径和查询参数。
    location ^~ /api/ {
        proxy_pass $backend_origin$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
        proxy_cache off;
        proxy_hide_header Cache-Control;
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }


    # 入口文件每次重新读取，避免部署后引用旧的资源文件。
    location = /index.html {
        add_header Cache-Control "no-store" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Android 安装包直接下载，不做 SPA 回退。
    location ^~ /downloads/ {
        try_files $uri =404;
        types {
            application/vnd.android.package-archive apk;
            application/pdf pdf;
        }
        add_header Content-Disposition "attachment" always;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }

    # Vite 的 assets 文件名含内容摘要，成功响应可长期缓存。
    location ^~ /assets/ {
        try_files $uri =404;
        # 基础镜像的 mime.types 没有 .mjs；缺了它浏览器会拒绝动态 import（pdf.js worker）。
        # 只调整该扩展的默认类型，不动全局 types 表。
        location ~* \.mjs$ {
            default_type text/javascript;
        }
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }

    location ~ /\. {
        deny all;
    }

    # 缺失的静态文件必须返回 404，不能返回 index.html。
    location ~* \.(?:js|mjs|css|map|json|png|jpe?g|gif|svg|ico|webp|avif|woff2?|ttf|otf|pdf|txt|xml|webmanifest)$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }

    # React Router 深链接刷新时回到应用入口。
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options nosniff always;
    }
}
